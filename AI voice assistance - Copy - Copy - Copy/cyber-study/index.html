<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22603VIC Cyber Security — Study Portal</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #273548;
    --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --green: #4ade80; --amber: #fbbf24;
    --red: #f87171; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  #sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  #progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .4s; }
  #progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  #nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .nav-section { padding: 6px 16px 2px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 16px; cursor: pointer;
    font-size: 13px; color: var(--muted); border-radius: 0; transition: all .15s; position: relative;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(56,189,248,.12); color: var(--accent); }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-item .badge {
    margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: 9999px;
    background: var(--surface2); color: var(--muted);
  }
  .nav-item.done .badge { background: rgba(74,222,128,.15); color: var(--green); }
  .nav-week { font-size: 10px; color: var(--purple); font-weight: 600; }

  /* ── Main content ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  #topbar h2 { font-size: 15px; font-weight: 600; flex: 1; }
  .tab-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .tab-btn:hover { background: var(--surface2); color: var(--text); }
  .tab-btn.active { background: rgba(56,189,248,.15); border-color: var(--accent); color: var(--accent); }
  #mark-done-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--green);
    background: rgba(74,222,128,.1); color: var(--green); font-size: 12px; cursor: pointer; transition: all .15s;
  }
  #mark-done-btn:hover { background: rgba(74,222,128,.2); }

  #content-area { flex: 1; overflow-y: auto; padding: 32px; max-width: 900px; margin: 0 auto; width: 100%; }

  /* ── Markdown styles ── */
  #md-content h1 { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  #md-content h2 { font-size: 18px; font-weight: 600; color: var(--accent); margin: 28px 0 12px; }
  #md-content h3 { font-size: 15px; font-weight: 600; color: var(--amber); margin: 20px 0 8px; }
  #md-content h4 { font-size: 13px; font-weight: 600; color: var(--purple); margin: 16px 0 6px; }
  #md-content p { line-height: 1.7; color: var(--text); margin-bottom: 12px; font-size: 14px; }
  #md-content ul, #md-content ol { padding-left: 20px; margin-bottom: 12px; }
  #md-content li { line-height: 1.7; font-size: 14px; color: var(--text); margin-bottom: 3px; }
  #md-content strong { color: var(--text); font-weight: 600; }
  #md-content em { color: var(--muted); }
  #md-content code { background: rgba(56,189,248,.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  #md-content pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 12px 0; overflow-x: auto; }
  #md-content pre code { background: none; color: inherit; padding: 0; font-size: 13px; }
  #md-content blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: rgba(56,189,248,.05); border-radius: 0 6px 6px 0; }
  #md-content blockquote p { color: var(--muted); margin: 0; }
  #md-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
  #md-content th { background: var(--surface2); padding: 8px 12px; text-align: left; border: 1px solid var(--border); color: var(--accent); font-size: 12px; font-weight: 600; }
  #md-content td { padding: 8px 12px; border: 1px solid var(--border); color: var(--text); vertical-align: top; }
  #md-content tr:nth-child(even) td { background: rgba(255,255,255,.02); }
  #md-content a { color: var(--accent); }
  #md-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* ── Quiz mode ── */
  #quiz-area { display: none; padding: 0; }
  .quiz-q { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .quiz-q p { font-size: 14px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
  .quiz-q .q-num { font-size: 11px; color: var(--muted); font-weight: 400; display: block; margin-bottom: 6px; }
  .reveal-btn { padding: 8px 16px; border-radius: 6px; background: rgba(56,189,248,.1); border: 1px solid var(--accent); color: var(--accent); font-size: 12px; cursor: pointer; }
  .answer-box { display: none; margin-top: 12px; padding: 14px; background: rgba(74,222,128,.05); border: 1px solid rgba(74,222,128,.2); border-radius: 8px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .answer-box.visible { display: block; }
  .self-rate { display: flex; gap: 8px; margin-top: 10px; }
  .rate-btn { padding: 4px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid; transition: all .15s; }
  .rate-btn.know { border-color: var(--green); color: var(--green); background: transparent; }
  .rate-btn.know:hover, .rate-btn.know.selected { background: rgba(74,222,128,.15); }
  .rate-btn.review { border-color: var(--amber); color: var(--amber); background: transparent; }
  .rate-btn.review:hover, .rate-btn.review.selected { background: rgba(251,191,36,.15); }
  #quiz-score { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 16px; display: none; }
  #quiz-score h3 { font-size: 18px; color: var(--green); margin-bottom: 8px; }
  #quiz-score p { color: var(--muted); font-size: 13px; }

  /* ── Loading ── */
  #loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>🔐 Cyber Security</h1>
    <p>22603VIC Certificate IV · BGT15</p>
    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <div id="progress-label">0 of 22 weeks completed</div>
  </div>
  <nav id="nav"></nav>
</div>

<div id="main">
  <div id="topbar">
    <h2 id="page-title">Welcome</h2>
    <button class="tab-btn active" onclick="showTab('notes')" id="tab-notes">📖 Notes</button>
    <button class="tab-btn" onclick="showTab('examples')" id="tab-examples">🏗️ DriveBook</button>
    <button class="tab-btn" onclick="showTab('deepdive')" id="tab-deepdive">🔬 Deep Dive</button>
    <button class="tab-btn" onclick="showTab('quiz')" id="tab-quiz">🎯 Quiz</button>
    <button id="mark-done-btn" onclick="markDone()">✓ Mark done</button>
  </div>
  <div id="content-area">
    <div id="md-content"></div>
    <div id="quiz-area"></div>
    <div id="loading" style="display:none">Loading…</div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const UNITS = [
  {
    id: 'overview', week: null, label: 'Overview & Schedule', badge: 'Start here',
    files: { notes: 'README.md', examples: null },
    section: 'Getting Started'
  },
  {
    id: 'whs', week: '1', label: 'WHS Communication', badge: 'BSBWHS309',
    files: { notes: 'week-01-BSBWHS309/NOTES.md', examples: 'week-01-BSBWHS309/DRIVEBOOK-EXAMPLES.md', rpl: 'week-01-BSBWHS309/RPL-EVIDENCE.md' },
    section: 'Core Units'
  },
  {
    id: 'ict443', week: '2', label: 'Work Collaboratively', badge: 'ICTICT443',
    files: { notes: 'week-02-ICTICT443/NOTES.md', examples: 'week-02-ICTICT443/DRIVEBOOK-EXAMPLES.md' },
    section: 'Core Units'
  },
  {
    id: 'research', week: '3', label: 'Research & Reporting', badge: 'BSBINS401',
    files: { notes: 'week-03-BSBINS401/NOTES.md', examples: null },
    section: 'Core Units'
  },
  {
    id: 'cyber-need', week: '4–5', label: 'Need for Cyber Security', badge: 'VU23217',
    files: { notes: 'week-04-05-VU23217/NOTES.md', examples: 'week-04-05-VU23217/DRIVEBOOK-EXAMPLES.md', deepdive: 'week-04-05-VU23217/DEEP-DIVE.md' },
    section: 'Core Units'
  },
  {
    id: 'networking', week: '6–7', label: 'Network Concepts', badge: 'VU23213',
    files: { notes: 'week-06-07-VU23213/NOTES.md', examples: 'week-06-07-VU23213/DRIVEBOOK-EXAMPLES.md', deepdive: 'week-06-07-VU23213/DEEP-DIVE.md' },
    section: 'Core Units'
  },
  {
    id: 'testing', week: '8–10', label: 'Security Testing', badge: 'VU23215',
    files: { notes: 'week-08-10-VU23215/NOTES.md', examples: 'week-08-10-VU23215/DRIVEBOOK-OWASP-ASSESSMENT.md', deepdive: 'week-08-10-VU23215/DEEP-DIVE.md' },
    section: 'Core Units'
  },
  {
    id: 'legislation', week: '11', label: 'Legislation & Privacy', badge: 'VU23223',
    files: { notes: 'week-11-VU23223/NOTES.md', examples: 'week-11-VU23223/DRIVEBOOK-EXAMPLES.md', deepdive: 'week-11-VU23223/DEEP-DIVE.md' },
    section: 'Core Units'
  },
  {
    id: 'project', week: '12–14', label: 'Industry Project', badge: 'VU23220',
    files: { notes: 'week-12-14-VU23220/NOTES.md', examples: null, deepdive: 'week-12-14-VU23220/DEEP-DIVE.md' },
    section: 'Core Units'
  },
  {
    id: 'electives', week: '15–22', label: 'Elective Units', badge: 'Cloud+',
    files: { notes: 'week-15-22-electives/NOTES.md', examples: null, deepdive: 'week-15-22-electives/DEEP-DIVE.md' },
    section: 'Electives'
  },
  {
    id: 'questions', week: null, label: 'Master Questions', badge: '46 Qs',
    files: { notes: 'MASTER-QUESTIONS.md', examples: null, quiz: true },
    section: 'Practice'
  },
];

// ── State ─────────────────────────────────────────────────────────────────────
let currentUnit = 'overview';
let currentTab = 'notes';
let fileCache = {};
let doneUnits = JSON.parse(localStorage.getItem('cyber-done') || '[]');
let quizRatings = JSON.parse(localStorage.getItem('cyber-ratings') || '{}');

// ── Build sidebar ─────────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('nav');
  let currentSection = '';
  nav.innerHTML = '';
  UNITS.forEach(unit => {
    if (unit.section !== currentSection) {
      currentSection = unit.section;
      const sec = document.createElement('div');
      sec.className = 'nav-section';
      sec.textContent = currentSection;
      nav.appendChild(sec);
    }
    const item = document.createElement('div');
    item.className = 'nav-item' + (unit.id === currentUnit ? ' active' : '') + (doneUnits.includes(unit.id) ? ' done' : '');
    item.dataset.id = unit.id;
    item.innerHTML = `
      ${unit.week ? `<span class="nav-week">W${unit.week}</span>` : '<span class="nav-week" style="opacity:0">W0</span>'}
      <span style="flex:1">${unit.label}</span>
      <span class="badge">${doneUnits.includes(unit.id) ? '✓' : unit.badge}</span>
    `;
    item.onclick = () => navigate(unit.id);
    nav.appendChild(item);
  });
  updateProgress();
}

function updateProgress() {
  const pct = Math.round((doneUnits.length / UNITS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${doneUnits.length} of ${UNITS.length} units completed`;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function navigate(id) {
  currentUnit = id;
  currentTab = 'notes';  // Reset to notes when navigating to a new unit
  buildNav();
  loadUnit();
}

function showTab(tab) {
  currentTab = tab;
  ['notes','examples','deepdive','quiz'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  // Clear the file cache to ensure fresh content loads
  fileCache = {};
  renderCurrentTab();
}

async function loadUnit() {
  const unit = UNITS.find(u => u.id === currentUnit);
  if (!unit) return;
  document.getElementById('page-title').textContent = (unit.week ? `Week ${unit.week} — ` : '') + unit.label;

  // Show/hide tab buttons based on available files
  const examplesBtn = document.getElementById('tab-examples');
  const deepdiveBtn = document.getElementById('tab-deepdive');
  const quizBtn = document.getElementById('tab-quiz');
  
  if (examplesBtn) examplesBtn.style.display = unit.files.examples ? '' : 'none';
  if (deepdiveBtn) deepdiveBtn.style.display = unit.files.deepdive ? '' : 'none';
  if (quizBtn) quizBtn.style.display = (unit.id === 'questions') ? '' : 'none';

  // Don't reset to notes tab if deepdive is available and we're already there
  if (currentTab === 'deepdive' && !unit.files.deepdive) {
    currentTab = 'notes';
  }
  if (currentTab === 'examples' && !unit.files.examples) {
    currentTab = 'notes';
  }
  
  ['notes','examples','deepdive','quiz'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    if (btn) btn.classList.toggle('active', t === currentTab);
  });

  renderCurrentTab();
}

async function renderCurrentTab() {
  const unit = UNITS.find(u => u.id === currentUnit);
  if (!unit) return;

  document.getElementById('md-content').style.display = currentTab === 'quiz' ? 'none' : 'block';
  document.getElementById('quiz-area').style.display = currentTab === 'quiz' ? 'block' : 'none';

  if (currentTab === 'quiz') {
    await renderQuiz();
    return;
  }

  let file;
  if (currentTab === 'examples') file = unit.files.examples;
  else if (currentTab === 'deepdive') file = unit.files.deepdive;
  else file = unit.files.notes;
  
  console.log('Loading tab:', currentTab, 'File:', file);  // Debug log
  
  if (!file) {
    document.getElementById('md-content').innerHTML = '<p style="color:var(--muted);padding:20px">No content for this tab.</p>';
    return;
  }

  document.getElementById('loading').style.display = 'flex';
  document.getElementById('md-content').innerHTML = '';

  const text = await fetchFile(file);
  document.getElementById('loading').style.display = 'none';

  if (!text) {
    document.getElementById('md-content').innerHTML = `<p style="color:var(--red)">Could not load <code>${file}</code>. Make sure you opened index.html from a local server (see instructions).</p>`;
    return;
  }

  document.getElementById('md-content').innerHTML = marked.parse(text);
  document.querySelectorAll('#md-content pre code').forEach(el => hljs.highlightElement(el));
  document.getElementById('content-area').scrollTop = 0;
}

async function fetchFile(path) {
  if (fileCache[path]) return fileCache[path];
  try {
    const r = await fetch(path);
    if (!r.ok) return null;
    const text = await r.text();
    fileCache[path] = text;
    return text;
  } catch {
    return null;
  }
}

// ── Quiz mode ─────────────────────────────────────────────────────────────────
async function renderQuiz() {
  const text = await fetchFile('MASTER-QUESTIONS.md');
  if (!text) {
    document.getElementById('quiz-area').innerHTML = '<p style="color:var(--muted)">Could not load questions.</p>';
    return;
  }

  // Parse Q&A pairs from the markdown
  const questions = parseQuestions(text);
  const qa = document.getElementById('quiz-area');
  qa.innerHTML = '';

  const known = Object.values(quizRatings).filter(v => v === 'know').length;
  const total = questions.length;

  const scoreDiv = document.createElement('div');
  scoreDiv.id = 'quiz-score';
  scoreDiv.innerHTML = `<h3>🎯 ${known}/${total} questions rated "I know this"</h3>
    <p>Click "Reveal Answer" on each question, then rate yourself. Progress saves automatically.</p>`;
  scoreDiv.style.display = 'block';
  qa.appendChild(scoreDiv);

  questions.forEach((q, i) => {
    const rating = quizRatings[i] || null;
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `
      <span class="q-num">Question ${i+1} of ${total} · ${q.section}</span>
      <p>${escapeHtml(q.question)}</p>
      <button class="reveal-btn" onclick="revealAnswer(${i})">Reveal Answer</button>
      <div class="answer-box ${rating ? 'visible' : ''}" id="ans-${i}">${marked.parse(q.answer || '_No model answer recorded yet. Write your own._')}</div>
      <div class="self-rate" id="rate-${i}" style="${rating ? '' : 'display:none'}">
        <span style="font-size:11px;color:var(--muted);align-self:center">How well do you know this?</span>
        <button class="rate-btn know ${rating==='know'?'selected':''}" onclick="rate(${i},'know')">✓ I know this</button>
        <button class="rate-btn review ${rating==='review'?'selected':''}" onclick="rate(${i},'review')">↻ Need review</button>
      </div>
    `;
    qa.appendChild(div);
  });
}

function parseQuestions(text) {
  const questions = [];
  let currentSection = '';
  const lines = text.split('\n');
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith('## ')) currentSection = line.slice(3).trim();
    // Questions are numbered lines like "1. What is..."
    const qMatch = line.match(/^(\d+)\.\s+(.+)/);
    if (qMatch) {
      questions.push({ section: currentSection, question: qMatch[2], answer: '', index: parseInt(qMatch[1]) - 1 });
    }
    i++;
  }
  return questions;
}

function revealAnswer(i) {
  document.getElementById('ans-' + i).classList.add('visible');
  document.getElementById('rate-' + i).style.display = 'flex';
}

function rate(i, val) {
  quizRatings[i] = val;
  localStorage.setItem('cyber-ratings', JSON.stringify(quizRatings));
  document.querySelectorAll(`#rate-${i} .rate-btn`).forEach(btn => {
    btn.classList.toggle('selected', btn.classList.contains(val));
  });
  // Update score
  const known = Object.values(quizRatings).filter(v => v === 'know').length;
  const score = document.getElementById('quiz-score');
  if (score) score.querySelector('h3').textContent = `🎯 ${known}/46 questions rated "I know this"`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Mark done ─────────────────────────────────────────────────────────────────
function markDone() {
  if (!doneUnits.includes(currentUnit)) {
    doneUnits.push(currentUnit);
  } else {
    doneUnits = doneUnits.filter(id => id !== currentUnit);
  }
  localStorage.setItem('cyber-done', JSON.stringify(doneUnits));
  buildNav();
}

// ── Init ──────────────────────────────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });
buildNav();
loadUnit();
</script>
</body>
</html>
