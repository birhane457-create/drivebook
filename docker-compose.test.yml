version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: drivebook-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: drivebook_test
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with any existing PostgreSQL
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d drivebook_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
