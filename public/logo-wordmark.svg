  <line x1="32" y1="18" x2="32" y2="44" stroke="white" stroke-width="2" opacity="0.65"/>

  <!-- Checkmark badge -->
  <circle cx="47" cy="25" r="11" fill="url(#iconBg)"/>
  <circle cx="47" cy="25" r="9"  fill="white" opacity="0.12"/>
  <polyline points="42,25 46,29 53,20" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark: DriveBook -->
  <text
    x="84"
    y="55"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
